name: Deploy to GitHub Pages

# Publishes the site pages (landing page, proposal, reports) to GitHub Pages on
# every push to main. Only the rendered pages are published — data/, templates/,
# scripts/ and schema/ stay repo-only. The pages are self-contained and
# .nojekyll turns off Jekyll processing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the landing page is current
        run: |
          python scripts/build_index.py
          git diff --exit-code index.html
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r proposal reports _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
